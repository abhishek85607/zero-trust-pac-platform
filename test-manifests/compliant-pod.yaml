apiVersion: v1
kind: Pod
metadata:
  name: secure-compliant-pod
  namespace: zero-trust-apps
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: app
      image: busybox:latest
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        privileged: false
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
