apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - zero-trust-apps
      validate:
        message: "Zero-Trust Violation: Privileged mode is strictly prohibited."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
